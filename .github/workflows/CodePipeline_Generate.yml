# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "feature1" ]
  pull_request:
    branches: [ "feature1" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: [self-hosted, mainframe]

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      # Runs a single command using the runners shell
      - name: Run a one-line script
        run: echo Hello, world!

      # Runs a set of commands using the runners shell
      - name: Run a multi-line script
        run: |
          echo Add other actions to build,
          echo test, and deploy your project.
          
      - name: Code Pipeline Generate
        # You may pin to the exact commit or the version.
        # uses: bmc-compuware/ispw-generate@9356ed36a2ee88f735203403ad86afe859b42790
        uses: bmc-compuware/ispw-generate@v1.5
        id: generate
        with:
        # The URL to send requests to.
          ces_url:"http://cwcc.bmc.com:2020"
        # The token to use when connecting to Code Pipeline through CES.
          ces_token: 708c4193-b59a-4265-97a2-7b99fff15dc8
        # The ID for the instance of Code Pipeline to connect to
          srid: "CCGA"
        # The runtime configuration used when connecting to Code Pipeline
          runtime_configuration: ICCGA
          assignment_id: CCV1000076
          level: DEV3
      - name: Get the set ID for the generate
        run: echo "The Code Pipeline set used for the generate is ${{ steps.generate.outputs.set_id }}"
